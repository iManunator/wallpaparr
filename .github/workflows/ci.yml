# Wallpaparr CI
#
# Pull requests: test + build the image locally (no GHCR push) and upload
#   wallpaparr-plugin-apk + wallpaparr-image artifacts.
# Pushes to main: same tests, then publish ghcr.io/imanunator/wallpaparr
#   with tags :latest, :ci, and :sha-<git>. Requires packages: write so
#   GITHUB_TOKEN can push to GHCR. The package is linked to this repo via
#   org.opencontainers.image.source (see docker/metadata-action labels).
# Tags (v*): the Release workflow also publishes GHCR + GitHub Release APKs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/imanunator/wallpaparr
  # Keep in sync with release.yml — GHCR package name is wallpaparr (lowercase).
  GHCR_PACKAGE: https://github.com/iManunator/wallpaparr/pkgs/container/wallpaparr

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK platforms (no obsolete tools package)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager not found under $ANDROID_HOME" >&2
            ls -la "$ANDROID_HOME" || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: JVM unit tests (no Android SDK compile of :app)
        working-directory: plugin
        run: ./gradlew :core:test --no-daemon
      - name: Android unit tests and sideload APKs
        working-directory: plugin
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --no-daemon
      - name: Stage named APKs
        run: |
          mkdir -p dist
          cp plugin/app/build/outputs/apk/debug/app-debug.apk dist/wallpaparr-plugin-debug.apk
          cp plugin/app/build/outputs/apk/release/app-release.apk dist/wallpaparr-plugin-release.apk
      - name: Upload plugin APKs
        uses: actions/upload-artifact@v4
        with:
          name: wallpaparr-plugin-apk
          path: dist/wallpaparr-plugin-*.apk
          if-no-files-found: error

  image:
    # Publish GHCR only on main (and tags, if this workflow ever runs there).
    # Job-level packages: write is required for docker/login-action + push.
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=Wallpaparr
            org.opencontainers.image.description=Cinematic Projectivy live/parallax wallpapers from Jellyfin and Seerr
            org.opencontainers.image.source=https://github.com/iManunator/wallpaparr
            org.opencontainers.image.url=https://github.com/iManunator/wallpaparr
            org.opencontainers.image.documentation=https://github.com/iManunator/wallpaparr#readme
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=iManunator
          tags: |
            type=raw,value=ci,enable=true
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=ref,event=tag
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:ci
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Save loadable image artifact
        if: github.event_name == 'pull_request'
        run: |
          docker save "${IMAGE}:ci" | gzip > wallpaparr-image.tar.gz
          ls -lh wallpaparr-image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: wallpaparr-image
          path: wallpaparr-image.tar.gz
          if-no-files-found: error
